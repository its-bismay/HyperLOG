[project]
name = "hyperlog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bibhabasu Bismay Kumar Naik", email = "2023ugee070@nitjsr.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis[hiredis]>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
hyperlog = "hyperlog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
